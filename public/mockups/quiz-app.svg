<svg width="640" height="360" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="640" height="360" fill="#0A0A0A"/>
  
  <!-- Title bar -->
  <rect x="0" y="0" width="640" height="32" fill="#1F2937"/>
  <circle cx="16" cy="16" r="6" fill="#EF4444"/>
  <circle cx="36" cy="16" r="6" fill="#F59E0B"/>
  <circle cx="56" cy="16" r="6" fill="#4AF626"/>
  <text x="320" y="20" fill="#9CA3AF" font-size="12" text-anchor="middle" font-family="monospace" font-weight="500">Quiz App</text>
  
  <!-- Terminal content area -->
  <rect x="0" y="32" width="640" height="328" fill="#0A0A0A"/>
  
  <!-- Prompt line 1 -->
  <text x="16" y="60" fill="#4AF626" font-size="14" font-family="monospace" font-weight="500">$ 🦀 ./quiz-app</text>
  
  <!-- Description -->
  <text x="16" y="90" fill="#E5E7EB" font-size="13" font-family="monospace">A programming quiz app. 10 questions, instant answer hi</text>
  
  <!-- Tech stack label -->
  <text x="16" y="120" fill="#9CA3AF" font-size="12" font-family="monospace">Stack: Vue 3 | Vite | CSS3</text>
  
  <!-- Decorative separator -->
  <text x="16" y="160" fill="#1F2937" font-size="12" font-family="monospace">────────────────────────────────────</text>
  
  <!-- Cursor -->
  <text x="16" y="185" fill="#4AF626" font-size="14" font-family="monospace" font-weight="500">$ ▌</text>
</svg>